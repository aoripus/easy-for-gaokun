# =============================================================================
# HUAWEI MateBook E Go 2022 性能版（GK-W7X / gaokun3）专用 ALSA UCM2 profile
#
# 本文件是 easy-for-gaokun 项目为 gaokun3 提供的 UCM2 use-case 定义。
#
# 为什么需要它
# ------------
# 基线镜像把 gaokun3 显式映射到 LENOVO-X13s.conf（见
# /usr/share/alsa/ucm2/conf.d/sc8280xp/sc8280xp.conf 的 If.HUAWEI 分支）。
# 两台机器的 codec / 功放 / DAI 链路完全相同，所以能正常出声；但 X13s 是
# **双扬声器** 机型，其 BootSequence 把功放增益写在 12 —— 按 wsa883x 的
# PA Volume dB 曲线（0..14 = -3.00 dB 平段），12 就是 **-3.00 dB**。
#
# 内核在 sound/soc/qcom/sc8280xp.c 里把 "SpkrLeft/Right PA Volume" 硬性限幅到
# 17（代码注释：until we have active speaker protection in place），即
# **+1.50 dB**。硬件本身可到 +18 dB（控制值 30/31）。
# 也就是说：X13s profile 让本机跑在 -3.00 dB，而内核允许的上限是 +1.50 dB，
# 白白放弃了 4.5 dB。X13s 当初选 12 是因为它只有两个扬声器、且当年 wsa883x
# 的 PA 控件曾一度失效（见 LKML 2024-01-22 v5 cover letter）。
#
# 本文件只做一件事：沿用上游那份 profile 的全部结构，把两个 PA Volume
# 从 12 提到内核实测上限 17。**绝不越过内核限幅**，也绝不取消限幅 ——
# Linux 侧目前没有任何主动扬声器保护（VISENSE 关闭、ADSP Speaker Protection
# 模块默认关闭），越过限幅有烧毁扬声器的实际风险。
#
# 相关文档：docs/audio.md
# 安装方式：sudo ./scripts/30-audio.sh --apply
# =============================================================================

Syntax 4

SectionUseCase."HiFi" {
	File "/Qualcomm/sc8280xp/HiFi.conf"
	Comment "HiFi quality Music."
}

# 功放增益：内核实测 max = 17（+1.50 dB）；12 是 X13s 双扬声器的保守值。
BootSequence [
	cset "name='SpkrLeft PA Volume' 17"
	cset "name='SpkrRight PA Volume' 17"
	cset "name='HPHL Volume' 2"
	cset "name='HPHR Volume' 2"
	cset "name='ADC2 Volume' 10"
]

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"
Include.wcd-init.File "/codecs/wcd938x/init.conf"
Include.wsa-init.File "/codecs/wsa883x/init.conf"
Include.wsam-init.File "/codecs/qcom-lpass/wsa-macro/init.conf"
Include.rxm-init.File "/codecs/qcom-lpass/rx-macro/init.conf"
