# ============================================================================
# easy-for-gaokun — yamllint 配置
#
# 覆盖 `.github/**` 的命令、工作流与 issue 模板。GitHub Actions 需要
# `on:` 这种写法，因此 truthy 必须放行 on/off。
# ============================================================================

extends: default

rules:
  line-length:
    max: 200
    level: warning
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  truthy:
    # GitHub Actions 的 `on:` 是**键名**，而 YAML 1.1 会把 on/off 读成布尔值。
    # 本仓库的工作流坚持写未加引号的 `on:`（这是 Actions 的规范写法），
    # 因此关掉对键名的 truthy 检查，只保留对值的放行列表。
    check-keys: false
    allowed-values: ['true', 'false', 'on', 'off']
  document-start: disable
  brackets:
    max-spaces-inside: 1
  braces:
    max-spaces-inside: 1
  # 中文说明里常见很长的单行 description，不做强制折行
  key-ordering: disable

ignore: |
  downloads/
  Drv/
  Recovery/
  node_modules/
