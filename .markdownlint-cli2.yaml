# ============================================================================
# easy-for-gaokun — markdownlint-cli2 配置
#
# 本仓库文档几乎全是中文，实测记录里大量使用表格、裸 URL 与加粗小标题，
# 因此关闭若干"英文写作习惯"规则；其余规则保持默认，避免文档放任自流。
# ============================================================================

config:
  default: true
  MD013: false          # 行长：中文文档不做限制
  MD033: false          # 允许少量内联 HTML（<br>、<details>）
  MD034: false          # 允许裸 URL（引用实机输出与上游链接时很常见）
  MD036: false          # 允许用 **加粗** 当小节标题（实测记录习惯）
  MD041: false          # 允许文档以引用块/元信息开头
  MD024:
    siblings_only: true # 同一父级下不允许重复标题，不同小节可以同名

globs:
  - "**/*.md"

ignores:
  - "downloads/**"
  - "Drv/**"
  - "Recovery/**"
  - "node_modules/**"
